name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Rebuild catalog and skill-combination maps
        run: |
          python scripts/build_skill_combinations.py
          python scripts/build_skill_combination_index.py
          python scripts/build_skill_combination_docs.py
          python scripts/build_catalog.py
      - name: Validate skill combinations
        run: python scripts/validate_skill_combinations.py
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated files are committed
        shell: bash
        run: git diff --exit-code
