<text x="180" y="940" class="label">RESEARCH FOUNDATION</text>
<text x="180" y="965" font-size="18" font-weight="800" fill="#172033">Evidence governance  ·  Reproducible compute  ·  Data and access control  ·  Human review  ·  Auditability</text>
<text x="1725" y="1018" text-anchor="end" class="footer">LL-AcademicSkillsHub · 2026</text>
