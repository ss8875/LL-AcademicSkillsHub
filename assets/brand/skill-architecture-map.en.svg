<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
<title id="title">LL-AcademicSkillsHub End-to-End Academic Skills System</title>
<desc id="desc">187 skills across 18 categories in five linked research stages.</desc>

<defs>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFF"/>
    <stop offset="1" stop-color="#F4F7FB"/>
  </linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#0F172A" stroke-opacity=".035"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".10"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#64748B"/>
  </marker>
  <marker id="feedback" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#0F9F8F"/>
  </marker>
  <style>
    text { font-family: Inter, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 800; letter-spacing: 3px; fill: #64748B; }
    .page-title { font-size: 44px; font-weight: 900; fill: #0F172A; }
    .page-subtitle { font-size: 20px; fill: #475569; }
    .stage-title { font-size: 24px; font-weight: 900; fill: #0F172A; }
    .stage-goal { font-size: 16px; fill: #475569; }
    .count { font-size: 15px; font-weight: 800; }
    .category-title { font-size: 23px; font-weight: 900; fill: #0F172A; }
    .category-purpose { font-size: 16px; fill: #64748B; }
    .skill-title { font-size: 17px; font-weight: 700; fill: #172033; }
    .skill-id { font-size: 11px; font-weight: 600; fill: #64748B; letter-spacing: .25px; }
    .label { font-size: 13px; font-weight: 900; letter-spacing: 1px; fill: #64748B; }
    .flow-value { font-size: 18px; font-weight: 800; fill: #172033; }
    .footer { font-size: 15px; fill: #64748B; }
  </style>
</defs>

<rect width="1800" height="1040" fill="url(#page)"/>
<rect width="1800" height="1040" fill="url(#grid)"/>
<circle cx="1650" cy="70" r="290" fill="#2563EB" opacity=".035"/>
<circle cx="80" cy="900" r="240" fill="#0F9F8F" opacity=".035"/>
<text x="70" y="68" class="eyebrow">LL-ACADEMICSKILLSHUB · RESEARCH OPERATING SYSTEM</text>
<text x="70" y="126" class="page-title">End-to-End Academic Skills System</text>
<text x="70" y="164" class="page-subtitle">One overview links five stages; parallel domain branches converge into an evidence feedback loop</text>
<rect x="1450" y="72" width="280" height="74" rx="22" fill="#0F172A"/>
<text x="1590" y="106" text-anchor="middle" font-size="30" font-weight="900" fill="#FFFFFF">187</text>
<text x="1590" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#CBD5E1">SKILLS · 18 CATEGORIES</text>
<g filter="url(#shadow)">
<rect x="60" y="320" width="350" height="260" rx="26" fill="#FFFFFF" stroke="#D9E2EE"/>
<rect x="60" y="320" width="12" height="260" rx="6" fill="#2563EB"/>
<rect x="88" y="344" width="94" height="34" rx="17" fill="#EAF2FF"/>
<text x="135" y="367" text-anchor="middle" class="count" fill="#2563EB">01</text>
<text x="202" y="369" font-size="22" font-weight="900" fill="#0F172A">Research Discovery &amp; Study Design</text>
<text x="90" y="411" class="label">GOAL</text>
<text x="90" y="437" class="stage-goal">Turn a research question into a</text>
<text x="90" y="459" class="stage-goal">searchable, testable, executable study</text>
<line x1="90" y1="474" x2="380" y2="474" stroke="#E2E8F0"/>
<text x="90" y="501" class="label">CAPABILITY GROUPS</text>
<text x="380" y="501" text-anchor="end" class="count" fill="#2563EB">52 SKILLS</text>
<text x="90" y="527" font-size="14" font-weight="700" fill="#334155">Academic Core · Literature Search &amp; Management</text>
<text x="90" y="552" font-size="14" font-weight="700" fill="#334155">Research Methods &amp; Scientific Reasoning · Scientific Databases</text>
</g>
