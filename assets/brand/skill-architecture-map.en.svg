<text x="1542" y="369" font-size="22" font-weight="900" fill="#0F172A">Scholarly Writing &amp; Research Impact</text>
<text x="1430" y="411" class="label">GOAL</text>
<text x="1430" y="437" class="stage-goal">Turn evidence, methods, and results into</text>
<text x="1430" y="459" class="stage-goal">papers, figures, talks, and deliverables</text>
<line x1="1430" y1="474" x2="1710" y2="474" stroke="#E2E8F0"/>
<text x="1430" y="501" class="label">CAPABILITY GROUPS</text>
<text x="1710" y="501" text-anchor="end" class="count" fill="#DB2777">22 SKILLS</text>
<text x="1430" y="527" font-size="14" font-weight="700" fill="#334155">Document Processing &amp; Data Tools · Scientific Writing &amp; Communication</text>
<text x="1430" y="552" font-size="14" font-weight="700" fill="#334155">Academic Presentation &amp; Visualization</text>
