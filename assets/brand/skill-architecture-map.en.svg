<text x="520" y="301" class="label">GOAL</text>
<text x="520" y="327" class="stage-goal">Build testable life-science evidence</text>
<text x="520" y="349" class="stage-goal">across omics, clinical, and structural</text>
<line x1="520" y1="364" x2="850" y2="364" stroke="#E2E8F0"/>
<text x="520" y="391" class="label">CAPABILITY GROUPS</text>
<text x="850" y="391" text-anchor="end" class="count" fill="#059669">46 SKILLS</text>
<text x="520" y="417" font-size="14" font-weight="700" fill="#334155">Bioinformatics &amp; Genomics · Clinical &amp; Precision Medicine</text>
<text x="520" y="442" font-size="14" font-weight="700" fill="#334155">Protein Engineering &amp; Structural Biology</text>
</g>
<g filter="url(#shadow)">
<rect x="490" y="535" width="390" height="250" rx="26" fill="#FFFFFF" stroke="#D9E2EE"/>
<rect x="490" y="535" width="12" height="250" rx="6" fill="#D97706"/>
<rect x="518" y="559" width="94" height="34" rx="17" fill="#FFF4DF"/>
<text x="565" y="582" text-anchor="middle" class="count" fill="#D97706">03</text>
<text x="632" y="584" font-size="22" font-weight="900" fill="#0F172A">Cross-domain Scientific Computing</text>
<text x="520" y="626" class="label">GOAL</text>
<text x="520" y="652" class="stage-goal">Connect molecular, materials, finance,</text>
<text x="520" y="674" class="stage-goal">and spatial data for domain research</text>
<line x1="520" y1="689" x2="850" y2="689" stroke="#E2E8F0"/>
<text x="520" y="716" class="label">CAPABILITY GROUPS</text>
<text x="850" y="716" text-anchor="end" class="count" fill="#D97706">30 SKILLS</text>
<text x="520" y="742" font-size="14" font-weight="700" fill="#334155">Cheminformatics &amp; Drug Discovery · Materials Science &amp; Computational Physics</text>
<text x="520" y="767" font-size="14" font-weight="700" fill="#334155">Finance &amp; Economics Data · Geospatial &amp; Remote Sensing</text>
</g>
