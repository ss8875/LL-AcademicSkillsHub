<text x="1112" y="369" font-size="22" font-weight="900" fill="#0F172A">Experiments, Data &amp; Intelligent Computing</text>
<text x="1000" y="411" class="label">GOAL</text>
<text x="1000" y="437" class="stage-goal">Turn experiments and multi-source data</text>
<text x="1000" y="459" class="stage-goal">into reproducible, explainable results</text>
<line x1="1000" y1="474" x2="1290" y2="474" stroke="#E2E8F0"/>
<text x="1000" y="501" class="label">CAPABILITY GROUPS</text>
<text x="1290" y="501" text-anchor="end" class="count" fill="#7C3AED">37 SKILLS</text>
<text x="1000" y="527" font-size="14" font-weight="700" fill="#334155">Laboratory Automation &amp; Integration · Data Analysis &amp; Statistical Modeling</text>
<text x="1000" y="552" font-size="14" font-weight="700" fill="#334155">Machine Learning &amp; AI · Platform &amp; Infrastructure</text>
</g>
<g filter="url(#shadow)">
<rect x="1400" y="320" width="340" height="260" rx="26" fill="#FFFFFF" stroke="#D9E2EE"/>
<rect x="1400" y="320" width="12" height="260" rx="6" fill="#DB2777"/>
<rect x="1428" y="344" width="94" height="34" rx="17" fill="#FDEAF3"/>
